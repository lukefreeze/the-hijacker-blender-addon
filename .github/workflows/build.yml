name: Build hijacker_engine

on:
  push:
    branches: [ feature/hijacker-engine ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ===========================================================================
  # WINDOWS
  # ===========================================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: pip install pybind11

      - name: Create audaspace stubs
        shell: pwsh
        run: |
          $stub = "#pragma once`nnamespace aud { typedef float sample_t; class ISound {}; class IReader {}; }"
          Set-Content -Path include\ISound.h -Value $stub
          $reader = "#pragma once`n#include `"ISound.h`""
          Set-Content -Path include\IReader.h -Value $reader

      - name: Install PortAudio via vcpkg
        shell: pwsh
        run: |
          vcpkg install portaudio:x64-windows-static
          # List what was actually installed so we can see the real lib filename
          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib\" | Select-Object Name

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build hijacker_engine.pyd
        shell: pwsh
        run: |
          $PYBIND11_INC = python -c "import pybind11; print(pybind11.get_include())"
          $PY_INC      = python -c "import sysconfig; print(sysconfig.get_path('include'))"
          $PY_LIBS     = python -c "import sysconfig; print(sysconfig.get_config_var('installed_base') + '\libs')"
          $PA_INC      = "C:\vcpkg\installed\x64-windows-static\include"
          # Find the actual portaudio lib name
          $PA_LIB      = (Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib\portaudio*.lib" | Select-Object -First 1).FullName
          Write-Host "Using PortAudio lib: $PA_LIB"

          cl /O2 /LD /EHsc /std:c++17 `
            /I "include" `
            /I "src" `
            /I "src\imgui" `
            /I "$PY_INC" `
            /I "$PYBIND11_INC" `
            /I "$PA_INC" `
            src\wrapper.cpp `
            src\hijacker_processor.cpp `
            src\hijacker_audio_engine.cpp `
            src\mixer_ui.cpp `
            src\imgui\imgui.cpp `
            src\imgui\imgui_draw.cpp `
            src\imgui\imgui_widgets.cpp `
            src\imgui\imgui_tables.cpp `
            /link `
            /OUT:blender_sync\hijacker_engine.pyd `
            /LIBPATH:"$PY_LIBS" `
            "$PA_LIB" `
            winmm.lib ole32.lib uuid.lib advapi32.lib

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-windows
          path: blender_sync/hijacker_engine.pyd


  # ===========================================================================
  # LINUX
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev
          pip install pybind11

      - name: Build static PortAudio
        # Built from source instead of `apt install portaudio19-dev` so the
        # end user never needs PortAudio installed on their own machine —
        # it gets baked directly into hijacker_engine.so.
        run: |
          git clone --depth 1 https://github.com/PortAudio/portaudio.git /tmp/portaudio
          # PortAudio's CMakeLists.txt uses a single PA_BUILD_SHARED_LIBS
          # switch (ON=shared/OFF=static) — NOT separate PA_BUILD_SHARED /
          # PA_BUILD_STATIC flags. Those don't exist in this project, so
          # CMake silently ignored them and built its default (shared)
          # config the first time this ran — verified against the real
          # CMakeLists.txt after the fact.
          cmake -S /tmp/portaudio -B /tmp/portaudio/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPA_BUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/portaudio/build --config Release -j
          PA_STATIC_LIB=$(find /tmp/portaudio/build -name "libportaudio.a" | head -1)
          if [ -z "$PA_STATIC_LIB" ]; then
            echo "ERROR: libportaudio.a was not produced — static build failed."
            find /tmp/portaudio/build -name "libportaudio*"
            exit 1
          fi
          echo "Built: $PA_STATIC_LIB"

      - name: Create audaspace stubs
        run: |
          printf '#pragma once\nnamespace aud { typedef float sample_t; class ISound {}; class IReader {}; }\n' > include/ISound.h
          printf '#pragma once\n#include "ISound.h"\n' > include/IReader.h

      - name: Build hijacker_engine.so
        run: |
          PYBIND11_INC=$(python -c "import pybind11; print(pybind11.get_include())")
          PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDLIBRARY'))")
          PY_LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          PA_INC=/tmp/portaudio/include
          PA_LIB=$(find /tmp/portaudio/build -name "libportaudio.a" | head -1)

          g++ -O2 -shared -fPIC -std=c++17 \
            -I include \
            -I src \
            -I src/imgui \
            -I "$PY_INC" \
            -I "$PYBIND11_INC" \
            -I "$PA_INC" \
            src/wrapper.cpp \
            src/hijacker_processor.cpp \
            src/hijacker_audio_engine.cpp \
            src/mixer_ui.cpp \
            src/imgui/imgui.cpp \
            src/imgui/imgui_draw.cpp \
            src/imgui/imgui_widgets.cpp \
            src/imgui/imgui_tables.cpp \
            -o blender_sync/hijacker_engine.so \
            -L"$PY_LIBDIR" -l:"$PY_LIB" \
            "$PA_LIB" \
            -lasound -lpthread -ldl -lm

      - name: Verify PortAudio is actually linked in (statically, not via system lib)
        run: |
          ldd blender_sync/hijacker_engine.so
          if ldd blender_sync/hijacker_engine.so | grep -qi "portaudio"; then
            echo "ERROR: hijacker_engine.so still dynamically depends on PortAudio!"
            exit 1
          fi
          # Positive check, not just absence-of-dependency: confirm
          # PortAudio's own symbols actually made it into the binary. A
          # bad/no-op static-lib build can otherwise "succeed" while
          # silently producing a binary with no PortAudio code in it at all.
          if ! nm -D blender_sync/hijacker_engine.so 2>/dev/null | grep -q Pa_Initialize; then
            if ! nm blender_sync/hijacker_engine.so 2>/dev/null | grep -q Pa_Initialize; then
              echo "ERROR: Pa_Initialize symbol not found in hijacker_engine.so — PortAudio wasn't actually linked in."
              exit 1
            fi
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-linux
          path: blender_sync/hijacker_engine.so


  # ===========================================================================
  # MACOS — Python framework needs special linking on macOS
  # ===========================================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: pip install pybind11

      - name: Build static PortAudio
        # Built from source instead of `brew install portaudio` so end users
        # never need Homebrew or PortAudio installed on their own Mac — it
        # gets baked directly into hijacker_engine.so. This is what was
        # missing before: the old brew-linked build only worked on machines
        # that happened to have `brew install portaudio` already run.
        run: |
          git clone --depth 1 https://github.com/PortAudio/portaudio.git /tmp/portaudio
          # PortAudio's CMakeLists.txt uses a single PA_BUILD_SHARED_LIBS
          # switch (ON=shared/OFF=static) — NOT separate PA_BUILD_SHARED /
          # PA_BUILD_STATIC flags. Those don't exist in this project, so
          # CMake silently ignored them and built its default (shared)
          # config the first time this ran — verified against the real
          # CMakeLists.txt after the fact.
          cmake -S /tmp/portaudio -B /tmp/portaudio/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPA_BUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build /tmp/portaudio/build --config Release -j
          PA_STATIC_LIB=$(find /tmp/portaudio/build -name "libportaudio.a" | head -1)
          if [ -z "$PA_STATIC_LIB" ]; then
            echo "ERROR: libportaudio.a was not produced — static build failed."
            find /tmp/portaudio/build -name "libportaudio*"
            exit 1
          fi
          echo "Built: $PA_STATIC_LIB"

      - name: Create audaspace stubs
        run: |
          printf '#pragma once\nnamespace aud { typedef float sample_t; class ISound {}; class IReader {}; }\n' > include/ISound.h
          printf '#pragma once\n#include "ISound.h"\n' > include/IReader.h

      - name: Build hijacker_engine.so
        run: |
          PYBIND11_INC=$(python -c "import pybind11; print(pybind11.get_include())")
          PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PA_INC=/tmp/portaudio/include
          PA_LIB=$(find /tmp/portaudio/build -name "libportaudio.a" | head -1)

          g++ -O2 -shared -fPIC -std=c++17 \
            -undefined dynamic_lookup \
            -I include \
            -I src \
            -I src/imgui \
            -I "$PY_INC" \
            -I "$PYBIND11_INC" \
            -I "$PA_INC" \
            src/wrapper.cpp \
            src/hijacker_processor.cpp \
            src/hijacker_audio_engine.cpp \
            src/mixer_ui.cpp \
            src/imgui/imgui.cpp \
            src/imgui/imgui_draw.cpp \
            src/imgui/imgui_widgets.cpp \
            src/imgui/imgui_tables.cpp \
            -o blender_sync/hijacker_engine.so \
            "$PA_LIB" \
            -framework CoreAudio \
            -framework AudioToolbox \
            -framework AudioUnit \
            -framework CoreServices \
            -framework CoreFoundation

      - name: Verify PortAudio is actually linked in (statically, not via Homebrew)
        run: |
          otool -L blender_sync/hijacker_engine.so
          if otool -L blender_sync/hijacker_engine.so | grep -Eqi "homebrew|/usr/local/opt|/opt/homebrew"; then
            echo "ERROR: hijacker_engine.so still depends on a Homebrew-installed library!"
            exit 1
          fi
          # Positive check, not just absence-of-dependency: confirm
          # PortAudio's own symbols actually made it into the binary. A
          # bad/no-op static-lib build can otherwise "succeed" (thanks to
          # -undefined dynamic_lookup tolerating missing symbols at link
          # time) while silently producing a binary with no PortAudio code
          # in it at all — exactly what happened the first time this ran.
          if ! nm blender_sync/hijacker_engine.so 2>/dev/null | grep -q Pa_Initialize; then
            echo "ERROR: Pa_Initialize symbol not found in hijacker_engine.so — PortAudio wasn't actually linked in."
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijacker_engine-macos
          path: blender_sync/hijacker_engine.so


  # ===========================================================================
  # PIPER (macOS) — fixes the official rhasspy/piper release, not our own code.
  #
  # Two separate upstream bugs, both confirmed by hand and both still unfixed
  # (the piper repo is now archived, so they never will be):
  #   1. Both "aarch64" and "x64" release archives actually contain x86_64
  #      binaries — a known mislabeling bug: github.com/rhasspy/piper/issues/523
  #   2. piper/piper_phonemize reference @rpath/libespeak-ng.1.dylib,
  #      @rpath/libonnxruntime.1.14.1.dylib and @rpath/libpiper_phonemize.1.dylib
  #      but ship with ZERO LC_RPATH entries baked in (verified with
  #      `otool -l` / macholib) — so those libraries can never resolve no
  #      matter where you put them: github.com/rhasspy/piper/issues/321.
  #      The piper release archive also doesn't even include those .dylib
  #      files at all — they only exist in the separate piper-phonemize
  #      release archive.
  #
  # This job downloads both official release archives, assembles a
  # self-contained folder (piper's binaries + piper-phonemize's actual
  # runtime .dylib files), patches in a real @executable_path/@loader_path
  # rpath with install_name_tool, re-signs the patched binaries (required —
  # install_name_tool invalidates the existing signature and Gatekeeper/dyld
  # will kill an unsigned binary on launch), and verifies with otool that
  # every @rpath reference actually has somewhere to resolve to before
  # uploading. There's no genuine arm64 build available upstream, so both
  # macos_arm and macos_x64 outputs are identical x86_64 builds — Apple
  # Silicon Macs run them under Rosetta 2, same as before.
  #
  # Manual-trigger only (not on every push) since this patches a fixed
  # third-party release, not anything in this repo — re-run it from the
  # Actions tab's "Run workflow" button only if you ever need to.
  # ===========================================================================
  fix-piper-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Download piper release (executables + espeak-ng-data)
        run: |
          curl -sSL -o piper_arm64.tar.gz "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_macos_aarch64.tar.gz"
          curl -sSL -o piper_x64.tar.gz   "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_macos_x64.tar.gz"
          mkdir -p out/macos_arm out/macos_x64
          tar -xzf piper_arm64.tar.gz -C out/macos_arm --strip-components=1
          tar -xzf piper_x64.tar.gz   -C out/macos_x64 --strip-components=1

      - name: Download piper-phonemize release (the actual runtime .dylib files)
        run: |
          curl -sSL -o pp_arm64.tar.gz "https://github.com/rhasspy/piper-phonemize/releases/download/2023.11.14-4/piper-phonemize_macos_aarch64.tar.gz"
          curl -sSL -o pp_x64.tar.gz   "https://github.com/rhasspy/piper-phonemize/releases/download/2023.11.14-4/piper-phonemize_macos_x64.tar.gz"
          mkdir -p pp_arm64 pp_x64
          tar -xzf pp_arm64.tar.gz -C pp_arm64
          tar -xzf pp_x64.tar.gz   -C pp_x64

          # Copy the real dylibs (+ their versioned symlinks) next to the
          # executables — this is the piece the piper release itself omits.
          cp -av pp_arm64/piper-phonemize/lib/libespeak-ng*.dylib       out/macos_arm/
          cp -av pp_arm64/piper-phonemize/lib/libonnxruntime*.dylib     out/macos_arm/
          cp -av pp_arm64/piper-phonemize/lib/libpiper_phonemize*.dylib out/macos_arm/
          cp -av pp_x64/piper-phonemize/lib/libespeak-ng*.dylib         out/macos_x64/
          cp -av pp_x64/piper-phonemize/lib/libonnxruntime*.dylib       out/macos_x64/
          cp -av pp_x64/piper-phonemize/lib/libpiper_phonemize*.dylib   out/macos_x64/

          # Drop the dSYM debug-symbol bundles — not needed at runtime, just bloat.
          rm -rf out/macos_arm/*.dSYM out/macos_x64/*.dSYM

      - name: Best-effort install Rosetta (only needed for this job's own verification step)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Patch rpaths and re-sign
        run: |
          for dir in out/macos_arm out/macos_x64; do
            echo "=== $dir ==="
            for bin in "$dir/piper" "$dir/piper_phonemize" "$dir/espeak-ng"; do
              [ -f "$bin" ] || continue
              chmod +w "$bin"
              # Give @rpath somewhere real to resolve: the folder the
              # binary itself sits in, since that's where we just put
              # the dylibs.
              install_name_tool -add_rpath "@executable_path" "$bin" || true
              install_name_tool -add_rpath "@loader_path" "$bin" || true
              codesign --remove-signature "$bin" || true
              codesign -s - -f "$bin"
            done
            for dylib in "$dir"/*.dylib; do
              [ -f "$dylib" ] || continue
              [ -L "$dylib" ] && continue   # skip symlinks, only patch real files
              chmod +w "$dylib"
              # libpiper_phonemize itself also references @rpath/libespeak-ng.1.dylib
              # and @rpath/libonnxruntime.1.14.1.dylib with the same missing-rpath bug.
              install_name_tool -add_rpath "@loader_path" "$dylib" || true
              codesign --remove-signature "$dylib" || true
              codesign -s - -f "$dylib"
            done
          done

      - name: Verify every @rpath dependency actually resolves
        run: |
          for dir in out/macos_arm out/macos_x64; do
            for bin in "$dir/piper" "$dir/piper_phonemize"; do
              echo "--- otool -L $bin ---"
              otool -L "$bin"
              echo "--- LC_RPATH entries in $bin ---"
              otool -l "$bin" | grep -A2 LC_RPATH
              if ! otool -l "$bin" | grep -q LC_RPATH; then
                echo "ERROR: $bin has no LC_RPATH entries — the @rpath fix didn't take."
                exit 1
              fi
            done
          done

          # Positive check: actually try to run it and confirm it gets past
          # library loading. A usage message or non-zero exit is fine — a
          # dyld "Library not loaded" error is specifically what we're
          # guarding against. Requires Rosetta on this arm64 runner; if
          # Rosetta isn't available the run itself will fail differently
          # and this check is simply skipped rather than failing the build.
          for dir in out/macos_arm out/macos_x64; do
            echo "=== running $dir/piper --help ==="
            "$dir/piper" --help > /tmp/piper_run.log 2>&1 || true
            cat /tmp/piper_run.log
            if grep -q "Library not loaded" /tmp/piper_run.log; then
              echo "ERROR: $dir/piper still can't find a required library"
              exit 1
            fi
          done

      - name: Zip fixed piper folders
        run: |
          cd out
          zip -r ../piper-macos-fixed.zip macos_arm macos_x64

      - name: Upload fixed piper artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper-macos-fixed
          path: piper-macos-fixed.zip
